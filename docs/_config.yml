    - "//github.com/maxpertici/markup"

# GitHub repository
repository: maxpertici/markup

# Navigation
nav_links:
  - title: Home
    url: /

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

